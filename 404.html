<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // SPA redirect for GitHub Pages
      // Stores the current path in sessionStorage and redirects to index
      var base = '/My-Webcore-Blog/';
      var path = window.location.pathname;
      if (path.startsWith(base)) {
        path = path.slice(base.length - 1); // keep leading /
      }
      sessionStorage.setItem('spa-redirect', path + window.location.search + window.location.hash);
      window.location.replace(base);
    </script>
  </head>
  <body></body>
</html>
