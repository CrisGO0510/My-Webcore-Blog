<div class="projects-page">
  <div class="projects-window" v-if="projects.length > 0">
    <!-- LADO IZQUIERDO: LISTA DE PROYECTOS -->
    <aside class="projects-list-panel">
      <h2 class="panel-title">{{ translations.projects.title }}</h2>
      <div class="projects-list">
        <div
          v-for="project in projects"
          :key="project.id"
          class="project-item"
          :class="{ active: selectedProject?.id === project.id }"
          @click="selectProject(project)"
        >
          <div class="project-icon">
            <q-icon name="terminal" size="1.5rem" />
          </div>
          <div class="project-item-info">
            <span class="project-item-name">{{ project.name }}</span>
            <span class="project-item-tech" v-if="project.technologies.length">{{ project.technologies[0] }}</span>
          </div>
          <span class="status-dot" :class="'status-' + project.status"></span>
        </div>
      </div>
    </aside>

    <!-- LADO DERECHO: DETALLE DEL PROYECTO -->
    <section class="project-detail-panel">
      <template v-if="selectedProject">
        <div class="detail-header">
          <h2 class="section-title">{{ selectedProject.name }}</h2>
          <span class="status-badge" :class="'status-' + selectedProject.status">
            <q-icon :name="getStatusConfig(selectedProject.status).icon" size="0.9rem" />
            {{ translations.projects.status[selectedProject.status] }}
          </span>
        </div>

        <div class="detail-description" v-if="selectedProject.description">
          <p>{{ selectedProject.description }}</p>
        </div>

        <div class="detail-tech" v-if="selectedProject.technologies.length > 0">
          <h3 class="detail-label">Stack</h3>
          <div class="tech-stack">
            <span
              v-for="tech in selectedProject.technologies"
              :key="tech"
              class="tech-tag"
            >
              {{ tech }}
            </span>
          </div>
        </div>

        <div class="detail-actions">
          <a
            v-if="selectedProject.link"
            :href="selectedProject.link"
            target="_blank"
            rel="noopener noreferrer"
            class="action-btn demo-btn"
          >
            <q-icon name="open_in_new" size="1rem" />
            {{ translations.projects.viewDemo }}
          </a>
          <a
            v-if="selectedProject.github"
            :href="selectedProject.github"
            target="_blank"
            rel="noopener noreferrer"
            class="action-btn code-btn"
          >
            <q-icon name="code" size="1rem" />
            {{ translations.projects.viewCode }}
          </a>
        </div>
      </template>

      <div class="empty-state" v-else>
        <q-icon name="folder_open" size="3rem" />
        <p>{{ translations.projects.selectProject }}</p>
      </div>
    </section>
  </div>

  <!-- No projects -->
  <div class="empty-state" v-else>
    <q-icon name="folder_off" size="4rem" />
    <p>{{ translations.projects.noProjects }}</p>
  </div>
</div>
