<div class="music-page">
  <div class="music-window" v-if="playlists.length > 0">
    <!-- LADO IZQUIERDO: PLAYLISTS -->
    <aside class="playlists-panel">
      <h2 class="panel-title">{{ translations.music.myPlaylists }}</h2>
      <div class="playlists-list">
        <div
          v-for="playlist in playlists"
          :key="playlist.id"
          class="playlist-item"
          :class="{ active: selectedPlaylist?.id === playlist.id }"
          @click="selectPlaylist(playlist)"
        >
          <div class="playlist-thumb">
            <img
              v-if="playlist.image"
              :src="playlist.image"
              :alt="playlist.name"
              loading="lazy"
            />
            <div v-else class="playlist-thumb-placeholder">
              <q-icon name="music_note" size="1.5rem" />
            </div>
          </div>
          <div class="playlist-info">
            <span class="playlist-name">{{ playlist.name }}</span>
            <span class="playlist-count">{{ playlist.totalTracks }} {{ translations.music.tracks }}</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- LADO DERECHO: TRACKS -->
    <section class="tracks-panel">
      <template v-if="selectedPlaylist">
        <div class="tracks-header">
          <div class="tracks-header-cover">
            <img
              v-if="selectedPlaylist.image"
              :src="selectedPlaylist.image"
              :alt="selectedPlaylist.name"
            />
            <div v-else class="tracks-header-placeholder">
              <q-icon name="music_note" size="3rem" />
            </div>
          </div>
          <div class="tracks-header-info">
            <h2 class="section-title">{{ selectedPlaylist.name }}</h2>
            <p v-if="selectedPlaylist.description" class="playlist-description">{{ selectedPlaylist.description }}</p>
            <span class="track-count-label">{{ selectedPlaylist.totalTracks }} {{ translations.music.tracks }}</span>
            <a
              :href="selectedPlaylist.url"
              target="_blank"
              rel="noopener noreferrer"
              class="spotify-link"
            >
              <q-icon name="open_in_new" size="1rem" />
              {{ translations.music.openInSpotify }}
            </a>
          </div>
        </div>

        <div class="tracks-list" v-if="selectedPlaylist.tracks.length > 0">
          <div
            v-for="(track, index) in selectedPlaylist.tracks"
            :key="index"
            class="track-item"
          >
            <span class="track-number">{{ index + 1 }}</span>
            <img
              v-if="track.image"
              :src="track.image"
              :alt="track.album"
              class="track-cover"
              loading="lazy"
            />
            <div v-else class="track-cover-placeholder">
              <q-icon name="album" size="1.2rem" />
            </div>
            <div class="track-info">
              <a :href="track.url" target="_blank" rel="noopener noreferrer" class="track-name">{{ track.name }}</a>
              <span class="track-artist">{{ track.artist }}</span>
            </div>
            <span class="track-duration">{{ track.duration }}</span>
          </div>
        </div>

        <div class="empty-state" v-else>
          <q-icon name="music_off" size="3rem" />
          <p>{{ translations.music.emptyPlaylist }}</p>
        </div>
      </template>

      <div class="empty-state" v-else>
        <q-icon name="queue_music" size="3rem" />
        <p>{{ translations.music.selectPlaylist }}</p>
      </div>
    </section>
  </div>

  <!-- No playlists -->
  <div class="empty-state" v-else>
    <q-icon name="music_off" size="4rem" />
    <p>{{ translations.music.noPlaylists }}</p>
  </div>
</div>
