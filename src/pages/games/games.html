<div class="games-page">
  <div class="games-window">
    <!-- LADO IZQUIERDO: STATS (hidden on mobile) -->
    <aside class="stats-panel">
      <div class="gaming-avatar">
        <div class="controller-icon">🎮</div>
      </div>

      <div class="stats-section">
        <h3 class="stats-title">{{ translations.games.stats.totalGames }}</h3>
        <div class="stats-grid">
          <div v-for="stat in gamingStats" :key="stat.id" class="stat-item">
            <div class="stat-info">
              <q-icon :name="stat.icon" class="stat-icon" />
              <span class="stat-label">{{ stat.label }}</span>
            </div>
            <span class="stat-value">{{ stat.value }}</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- NAVEGACIÓN: avatar + filtros en mobile -->
    <nav class="nav-rail">
      <div class="mobile-avatar">
        <div class="controller-icon">🎮</div>
      </div>
      <button
        :class="{ active: viewMode === 'favorites' }"
        @click="setViewMode('favorites')"
        :title="translations.games.viewModes.favorites"
      >
        <q-icon name="star" />
      </button>

      <button
        :class="{ active: viewMode === 'genre' }"
        @click="setViewMode('genre')"
        :title="translations.games.viewModes.genre"
      >
        <q-icon name="category" />
      </button>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="games-content">
      <header class="games-header">
        <h1 class="games-title">{{ translations.games.title }}</h1>
      </header>

      <!-- Vista por Favoritos (todos los juegos en orden de prioridad) -->
      <div v-if="viewMode === 'favorites'" class="favorites-view">
        <div class="games-section">
          <h2 class="section-title">
            {{ translations.games.viewModes.favorites }}
          </h2>
          <div class="games-grid">
            <div
              v-for="(game, index) in allGames"
              :key="game.name"
              class="game-card"
            >
              <div class="game-image-container">
                <img :src="game.image" :alt="game.name" class="game-image" />
                <div class="rank-badge">#{{ index + 1 }}</div>
              </div>
              <div class="game-info">
                <h3 class="game-name">{{ game.name }}</h3>
                <p class="game-genre">{{ game.genre }}</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Vista por Género -->
      <div v-if="viewMode === 'genre'" class="genre-view">
        <div
          v-for="(games, genre) in gamesByGenre"
          :key="genre"
          class="genre-section"
        >
          <h2 class="genre-title">{{ genre }}</h2>
          <div class="games-grid">
            <div v-for="game in games" :key="game.name" class="game-card">
              <div class="game-image-container">
                <img :src="game.image" :alt="game.name" class="game-image" />
              </div>
              <div class="game-info">
                <h3 class="game-name">{{ game.name }}</h3>
                <p class="game-genre">{{ game.genre }}</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
